# Автосборка: при каждом коммите в main (в том числе из админки Pages CMS)
# собирает сайт build.py и выкладывает dist/ на GitHub Pages.
# Ключи и пароли не нужны: GitHub Pages работает внутри GitHub.
name: Сборка и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  pages: write
  id-token: write

# Если правки идут подряд, публикуется последняя
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
